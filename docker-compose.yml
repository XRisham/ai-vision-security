services:
  backend:
    build: .
    ports: ["8000:8000"]
    volumes: ["./:/app"]
    environment:
      DATABASE_URL: sqlite:///./ai_vision.db
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes: ["./frontend:/app/frontend"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
